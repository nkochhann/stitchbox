name: Publish Package

on:
  workflow_dispatch: 
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write # Generate OIDC token

    steps:
      - name: Actions checkout
        uses: actions/checkout@v4

      - name: Node.js configuration
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Install npm most recent CLI, to avoid possible OIDC publishing errors
      - name: Update npm CLI
        run: npm install -g npm@latest

      - name: Test package
        run: npm test

      - name: Build dist
        run: npm run build

      - name: Publish package
        run: npm publish --provenance